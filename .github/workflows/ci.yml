name: AIRWISE AI CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Format, Tests, Coverage & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run TypeScript, ESLint, and Oxlint
        run: npm run lint

      - name: Verify formatting with Prettier
        run: npm run format:check

      - name: Run full test suite with coverage thresholds
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Verify no API secrets leaked into client bundle
        run: |
          if grep -rnE "GEMINI_API_KEY|AIza[0-9A-Za-z_-]{20,}" dist/ src/; then
            echo "Potential secret exposure detected in client files or bundle!"
            exit 1
          fi

      - name: Audit npm dependency tree for high/critical vulnerabilities
        run: |
          npm i --package-lock-only --ignore-scripts --legacy-peer-deps
          npm audit --audit-level=high
